# Local equivalent: make ci  (scripts/ci-local.sh)
# Never runs deploy-contract.sh — pinned ID: deployments/futurenet.json
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions (checkout, setup-node, pnpm) run on Node 24 — avoids Node 20 deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install and test SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @wraith/stellar-identity-sdk run build
          pnpm --filter @wraith/stellar-identity-sdk test

  adapter-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Adapter smoke
        run: make smoke
